[package]
name = "cuda-async"
version = "0.2.1"
edition = "2024"
description = "Async execution layer for CUDA device operations"
readme = "README.md"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"


# Standalone since the workspace switched to the shared host-side crates from
# cutile-rs; kept on disk so the example workspaces keep building unchanged.
# Same pattern as crates/rustc-codegen-cuda.
[workspace]

[dependencies]
rustc-hash = "2.0"
cuda-core = { path = "../cuda-core" }
cuda-bindings = { path = "../cuda-bindings" }
futures = "0.3"
thiserror = "2"
anyhow = "1.0"
