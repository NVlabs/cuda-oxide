[package]
name = "cuda-core"
version = "0.2.1"
edition = "2024"
description = "Safe RAII wrappers around the CUDA driver API (idiomatic host-side CUDA)"
readme = "README.md"
authors = ["Nihal Pasham <nihalp@nvidia.com>"]
license = "Apache-2.0"
repository = "https://github.com/NVlabs/cuda-oxide.git"


# Standalone since the workspace switched to the shared host-side crates from
# cutile-rs; kept on disk so the example workspaces keep building unchanged.
# Same pattern as crates/rustc-codegen-cuda.
[workspace]

[dependencies]
cuda-bindings = { path = "../cuda-bindings" }
cuda-macros = { path = "../cuda-macros" }
anyhow = "1.0"
half = "2.7"
oxide-artifacts = { path = "../oxide-artifacts", features = ["object-read"] }

[dev-dependencies]
oxide-artifacts = { path = "../oxide-artifacts", features = ["object-write"] }
# Test-only: the embedded-artifact round trip builds a link-anchor symbol,
# whose spelling is owned by reserved-oxide-symbols rather than restated here.
reserved-oxide-symbols = { path = "../reserved-oxide-symbols" }
trybuild = "1"
