[package]
name = "warp_reduce_redux_bench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Paired measurement of the two `warp_reduce` forms from one source:
#   cargo oxide run warp_reduce_redux_bench --arch sm_80   redux.sync
#   cargo oxide run warp_reduce_redux_bench --arch sm_75   shuffle butterfly

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
