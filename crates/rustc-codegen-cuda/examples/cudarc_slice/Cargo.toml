[package]
name = "cudarc_slice"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Mark as standalone crate (not part of parent workspace)
[workspace]

# Build with:
#   cargo oxide run cudarc_slice

[dependencies]
cuda-device = { path = "../../../cuda-device" }
cuda-host = { path = "../../../cuda-host" }
cuda-core = "0.3.1"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-version-from-build-system"] }
