[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/pliron-org/pliron",
    # Shared host-side crates (cuda-bindings, cuda-core, cuda-async), pinned
    # to the cutile-rs v0.3.1 tag until the 0.3.1 release is on crates.io.
    "https://github.com/NVlabs/cutile-rs",
]
