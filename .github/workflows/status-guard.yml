---
name: status-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  error-example-status-guard:
    name: error-example status guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Verify error* examples are in STATUS.md and smoketest.sh
        run: bash scripts/check-error-example-status.sh

  # Both of the things this checks are otherwise only visible when the suite
  # runs on a GPU: the compile-only lane collapses every category into
  # verdict_compile, so it never exercises classify() or the standard-category
  # success marker. 981b9eb0 is the precedent -- a new example landed with no
  # marker and needed a follow-up commit on main to stop reporting FAIL.
  example-smoketest-contract:
    name: smoketest example contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads sources only: no cargo, no CUDA toolkit, no LLVM.
      - name: Verify smoketest categories and standard-example success markers
        run: bash scripts/check-example-smoketest-contract.sh

  # README's Crate Overview is the only map of the tree a newcomer gets, and
  # nothing fails when a crate is missing from it: dialect-iket and iket-lower
  # were both absent, 1,700 lines with no row between them.
  crate-inventory:
    name: crate inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads Cargo.toml and README.md: no cargo, no lockfile, no network.
      - name: Verify README lists every workspace member
        run: bash scripts/check-crate-inventory.sh

  # The pin is copied into places no build compares: the nested backend pin
  # (rustup reads it for the backend's own [workspace], so a mismatch there
  # is a load failure rather than a warning), the scaffold `cargo oxide new`
  # writes into user projects, the devcontainer's preinstalled toolchain, the
  # book's quoted [toolchain] blocks, and the dated rustup/cargo commands in
  # the book and READMEs. #727 added rustfmt to both real files and left both
  # book quotes behind.
  toolchain-pin-parity:
    name: toolchain pin parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads sources only: no rustup, no cargo, no CUDA toolkit.
      - name: Verify every copy of the toolchain pin agrees
        run: bash scripts/check-toolchain-parity.sh

  # The book's Command reference is the only complete list of the CLI surface in
  # the docs, and adding a subcommand to the clap enum is a one-line change that
  # leaves it silently short -- `test`, `fmt`, `update` and `emit-ltoir` were all
  # missing when that table was written (#794).
  cli-doc-coverage:
    name: CLI command reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads the clap enum and the book: no cargo, no build, no network.
      - name: Verify the book documents every cargo oxide subcommand
        run: bash scripts/check-cli-doc-coverage.sh

  # A Rust code block in the book or a README is something a reader pastes. When
  # a device function is renamed the docs still render, so the stale name
  # survives until someone tries it -- #797 and the `warp::shuffle_xor_i32` entry
  # in the API quick reference were both found by hand, months apart. An example
  # README naming `warp::shfl`, which has never existed, widened the scope to
  # the crate and example READMEs.
  book-api-names:
    name: book device-API names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads the book, the crate and example READMEs, and cuda-device's
      # sources: no cargo, no build, no network.
      - name: Verify every device call the book shows resolves
        run: bash scripts/check-book-api-names.sh

  # Every guard here is wired twice: a step in this file, and a line in the
  # Justfile's `check-guards` recipe, which the Justfile calls a full local
  # mirror of this workflow. Only CI enforces itself, so the Justfile line is
  # the one that goes missing -- #1106 added check-book-catalog-stamp.sh here
  # and not there, and nothing failed. This step compares the two lists.
  guard-coverage:
    name: guard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads the Justfile and this directory: no cargo, no build, no network.
      - name: Verify every guard runs in CI and in `just check-guards`
        run: bash scripts/check-guard-coverage.sh

  # The dialect-nvvm book page prints the catalog SHA-256 and states its own
  # freshness rule: if the stamp no longer matches, every count on the page
  # predates the catalog being read. Nothing enforced that rule, so the page
  # failed its own test for weeks -- 560 operations printed against 570 in the
  # tree -- and only a hand audit caught it, twice. Machine-checking the stamp
  # turns "the counts are stale" into a red check on the pull request that
  # rotated the catalog. The counts stay hand-written; only the stamp is gated,
  # because the page derives staleness from it.
  book-catalog-stamp:
    name: book catalog stamp
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Hashes one file and greps one page: no cargo, no build, no network.
      - name: Verify the dialect page's catalog stamp is current
        run: bash scripts/check-book-catalog-stamp.sh

  # `unit-tests.yml`'s matrix is the only thing deciding which crates get
  # `cargo test`, and a member missing from it fails nothing: the workflow is
  # green, `just check` is green, and the tests never ran. #971 found four
  # crates in that state holding 107 tests between them, two of them for
  # months. The workflow's own "intentionally not in this matrix" comment
  # reading as complete is what hid them.
  test-matrix-coverage:
    name: test-matrix coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Reads Cargo.toml, unit-tests.yml and the Justfile: no cargo, no network.
      - name: Verify every workspace member is tested or declared untested
        run: bash scripts/check-test-matrix-coverage.sh

  # #702 let a kernel-only crate drop the host surface (and with it `cuda.h`) via
  # `cuda-macros = { default-features = false }`, which is what #701 asked for.
  # Nothing exercised it: no example takes that configuration, and every other
  # lane that builds a kernel crate has the toolkit installed. The bad direction
  # is quiet too -- proc-macro features unify per graph, so a stray
  # `cuda-macros/host` makes the expansion emit `cuda_host::` paths that a
  # device-only crate cannot resolve, and that surfaces downstream rather than
  # here.
  device-only-build:
    name: device-only kernel crate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      # Deliberately no CUDA toolkit step: a toolkit on the runner would mask
      # exactly the dependency this job exists to keep out of the graph.
      - name: Verify a kernel-only crate builds with no host surface
        run: bash scripts/check-device-only-build.sh
